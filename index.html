<!doctype html>
<html lang="fi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KAKAOK-TV v0.8.2</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
      :root {
        --bg: #0f0f0f;
        --card: #1e1e1e;
        --accent: #ff0000;
        --text: #ffffff;
      }
      body {
        font-family: "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
        margin: 0;
        overflow-x: hidden;
      }

      /* AUTH */
      #auth-overlay {
        position: fixed;
        inset: 0;
        background: #000;
        z-index: 2000;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }

      header {
        padding: 10px 15px;
        background: #222;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 2px solid var(--accent);
        height: 60px;
        box-sizing: border-box;
      }

      main {
        display: grid;
        grid-template-columns: 1.8fr 1.2fr;
        gap: 15px;
        padding: 15px;
        min-height: calc(100vh - 60px);
        box-sizing: border-box;
      }

      @media (max-width: 900px) {
        main {
          grid-template-columns: 1fr;
        }
      }

      .side-panel {
        display: flex;
        flex-direction: column;
        gap: 15px;
      }

      .card-section {
        background: var(--card);
        border-radius: 12px;
        padding: 15px;
      }

      /* PLAYER & REACTIONS */
      #player-container {
        width: 100%;
        aspect-ratio: 16/9;
        background: #000;
        border-radius: 12px;
        overflow: hidden;
      }
      .floating-emoji {
        position: absolute;
        bottom: 10%;
        font-size: 4rem;
        animation: floatUp 2s forwards;
        pointer-events: none;
      }
      @keyframes floatUp {
        from {
          transform: translateY(0);
          opacity: 1;
        }
        to {
          transform: translateY(-500px);
          opacity: 0;
        }
      }

      /* SEARCH */
      .search-area {
        display: flex;
        gap: 8px;
        width: 100%;
      }
      #query {
        flex: 1;
        padding: 12px;
        border-radius: 25px;
        border: 1px solid #333;
        background: #000;
        color: white;
        box-sizing: border-box;
      }
      .search-btn {
        padding: 10px 20px;
        background: var(--accent);
        color: white;
        border: none;
        border-radius: 20px;
        font-weight: bold;
      }

      #results {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-top: 15px;
      }
      .result-item {
        background: #333;
        border-radius: 8px;
        overflow: hidden;
        cursor: pointer;
        text-decoration: none;
        color: inherit;
        display: block;
      }
      .result-item img {
        width: 100%;
        display: block;
      }

      .btn-group {
        display: flex;
        justify-content: space-around;
        background: #222;
        padding: 10px;
        border-radius: 15px;
        margin-top: 10px;
        align-items: center;
        flex-wrap: wrap;
        gap: 5px;
      }
      button {
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="auth-overlay">
      <h2 style="color: var(--accent)">KAKAOK REMOTE</h2>
      <input type="password" id="passInput" placeholder="Sy&ouml;t&auml; koodi (1234)" />
      <button
        onclick="verifyPassword()"
        style="
          padding: 10px 30px;
          background: var(--accent);
          color: white;
          border: none;
          border-radius: 20px;
          margin-top: 10px;
        "
      >
        YHDIST&Auml;
      </button>
    </div>

    <header>
      <h2 style="margin: 0; color: var(--accent)">KAKAOK-TV</h2>
    </header>

    <main>
      <section>
        <div id="player-container"><div id="player"></div></div>
        <h3 id="currentTitle" style="margin-top: 15px">
          Odota, ett&auml; joku valitsee biisin...
        </h3>

        <div class="btn-group">
          <button
            onclick="sendEmoji('\uD83D\uDD25')"
            style="font-size: 2rem; background: none; border: none"
          >
            &#x1F525;
          </button>
          <button
            onclick="sendEmoji('\uD83D\uDC4F')"
            style="font-size: 2rem; background: none; border: none"
          >
            &#x1F44F;
          </button>
          <button
            onclick="sendEmoji('\u2764\uFE0F')"
            style="font-size: 2rem; background: none; border: none"
          >
            &#x2764;&#xFE0F;
          </button>
        </div>

        <div class="btn-group">
          <button
            onclick="control('play')"
            style="
              color: white;
              background: none;
              border: none;
              font-size: 1.5rem;
            "
            title="Toista"
          >
            &#x25B6;
          </button>
          <button
            onclick="control('pause')"
            style="
              color: white;
              background: none;
              border: none;
              font-size: 1.5rem;
            "
            title="Tauko"
          >
            &#x23F8;
          </button>
          <button
            onclick="control('stop')"
            style="
              color: white;
              background: none;
              border: none;
              font-size: 1.5rem;
            "
            title="Pys&auml;yt&auml;"
          >
            &#x23F9;
          </button>
          <button
            onclick="control('skip')"
            style="
              color: var(--accent);
              background: none;
              border: none;
              font-size: 1.2rem;
              font-weight: bold;
            "
            title="Ohita"
          >
            SKIP &#x23ED;
          </button>
          <button
            onclick="control('volDown')"
            style="
              color: white;
              background: none;
              border: none;
              font-size: 1.2rem;
              font-weight: bold;
            "
            title="Pienemm&auml;lle"
          >
            &#x1F509; -
          </button>
          <button
            onclick="control('volUp')"
            style="
              color: white;
              background: none;
              border: none;
              font-size: 1.2rem;
              font-weight: bold;
            "
            title="Suuremmalle"
          >
            &#x1F50A; +
          </button>
          <button
            onclick="control('mute')"
            style="
              color: white;
              background: none;
              border: none;
              font-size: 1.2rem;
            "
            title="Mykist&auml; / Poista mykistys"
          >
            &#x1F507;
          </button>
        </div>
      </section>

      <div class="side-panel">
        <section class="card-section">
          <h4 style="margin: 0 0 10px 0; color: var(--accent)">HAE KAPPALEITA</h4>
          <div class="search-area">
            <input
              type="text"
              id="query"
              placeholder="Hae biisi&auml; ja paina Enter..."
              onkeydown="if(event.key === 'Enter') handleSearch()"
            />
            <button class="search-btn" onclick="handleSearch()">HAE</button>
          </div>
          <div id="results"></div>
        </section>

        <section class="card-section" style="flex: 1; overflow-y: auto;">
          <h4 style="margin: 0 0 10px 0; color: var(--accent)">SOITTOJONO</h4>
          <div id="queueList"></div>
        </section>
      </div>
    </main>

    <script>
      const socket = typeof io !== 'undefined' ? io() : null;
      const API_KEY = "AIzaSyAPc4JAiR1ddtdmT6xgp2FA0Eb2R_TjOf0";
      let playlist = [];
      var player;
      let isPlaying = false;

      function verifyPassword() {
        if (socket) {
          socket.emit("check_password", {
            password: document.getElementById("passInput").value,
          });
        }
      }

      function sendEmoji(emoji) {
        if (socket) {
          socket.emit("send_reaction", { emoji });
        } else {
          showEmoji(emoji);
        }
      }

      function showEmoji(emoji) {
        const e = document.createElement("div");
        e.className = "floating-emoji";
        e.innerText = emoji;
        e.style.left = Math.random() * 80 + 10 + "%";
        document.body.appendChild(e);
        setTimeout(() => e.remove(), 2000);
      }

      function control(action) {
        if (socket) {
          socket.emit("remote_control", { action });
        } else {
          executeControl(action);
        }
      }

      function executeControl(action) {
        if (player) {
          if (action === "pause" && typeof player.pauseVideo === 'function') player.pauseVideo();
          if (action === "play" && typeof player.playVideo === 'function') player.playVideo();
          if (action === "stop" && typeof player.stopVideo === 'function') {
            player.stopVideo();
            isPlaying = false;
            document.getElementById("currentTitle").textContent = "Pys\u00E4ytetty";
          }
          if (action === "skip") playNext();
          if (action === "volUp" && typeof player.getVolume === 'function') {
            const currentVol = player.getVolume();
            player.setVolume(Math.min(currentVol + 10, 100));
          }
          if (action === "volDown" && typeof player.getVolume === 'function') {
            const currentVol = player.getVolume();
            player.setVolume(Math.max(currentVol - 10, 0));
          }
          if (action === "mute" && typeof player.isMuted === 'function') {
            if (player.isMuted()) {
              player.unMute();
            } else {
              player.mute();
            }
          }
        }
      }

      function handleSearch() {
        const q = document.getElementById("query").value.trim();
        if (q.length > 0) {
          searchYoutube(q + " karaoke");
        }
      }

      function decodeHTMLEntities(text) {
        const textArea = document.createElement('textarea');
        textArea.innerHTML = text;
        return textArea.value;
      }

      async function searchYoutube(q) {
        const resultsContainer = document.getElementById("results");
        resultsContainer.innerHTML = "<p style='grid-column: 1 / -1;'>Haetaan...</p>";

        try {
          const r = await fetch(
            `https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=4&q=${encodeURIComponent(q)}&type=video&key=${API_KEY}`,
          );
          const d = await r.json();

          if (d.error) {
            resultsContainer.innerHTML = `<p style="color:var(--accent); grid-column: 1 / -1;">Hakuvirhe: ${d.error.message}</p>`;
            return;
          }

          if (!d.items || d.items.length === 0) {
            resultsContainer.innerHTML = "<p style='grid-column: 1 / -1;'>Ei hakutuloksia.</p>";
            return;
          }

          resultsContainer.innerHTML = "";
          d.items.forEach((item) => {
            const cleanTitle = decodeHTMLEntities(item.snippet.title);
            const card = document.createElement("div");
            card.className = "result-item";

            const img = document.createElement("img");
            img.src = item.snippet.thumbnails.medium.url;

            const title = document.createElement("p");
            title.style.cssText = "font-size:10px; padding:5px; margin:0;";
            title.textContent = cleanTitle;

            card.appendChild(img);
            card.appendChild(title);

            card.onclick = () => {
              addToQueue({
                id: item.id.videoId,
                title: cleanTitle
              });
            };

            resultsContainer.appendChild(card);
          });
        } catch (err) {
          console.error("Hakuvirhe:", err);
          resultsContainer.innerHTML = "<p style='color:var(--accent); grid-column: 1 / -1;'>Verkkovirhe haettaessa tuloksia.</p>";
        }
      }

      function addToQueue(data) {
        if (socket && socket.connected) {
          socket.emit("add_to_queue", data);
        } else {
          handleQueueItem(data);
        }
      }

      function handleQueueItem(data) {
        playlist.push(data);
        updateUI();
        if (!isPlaying) {
          playNext();
        }
      }

      if (socket) {
        socket.on("password_result", (data) => {
          if (data.success) document.getElementById("auth-overlay").style.display = "none";
          else alert("V\u00E4\u00E4r\u00E4 koodi!");
        });
        socket.on("show_reaction", (data) => showEmoji(data.emoji));
        socket.on("execute_control", (data) => executeControl(data.action));
        socket.on("queue_updated", (data) => handleQueueItem(data));
      }

      function playNext() {
        if (playlist.length > 0) {
          isPlaying = true;
          const next = playlist.shift();
          if (player && typeof player.loadVideoById === 'function') {
            player.loadVideoById(next.id);
          }
          document.getElementById("currentTitle").textContent =
            "NYT SOI: " + next.title;
        } else {
          isPlaying = false;
        }
        updateUI();
      }

      function updateUI() {
        const list = document.getElementById("queueList");
        if (list) {
          list.innerHTML = "";
          playlist.forEach((i) => {
            const itemDiv = document.createElement("div");
            itemDiv.style.cssText = "padding:10px; border-bottom:1px solid #333;";
            itemDiv.textContent = i.title;
            list.appendChild(itemDiv);
          });
        }
      }

      // --- YT API ---
      var tag = document.createElement("script");
      tag.src = "https://www.youtube.com/iframe_api";
      document.body.appendChild(tag);

      function onYouTubeIframeAPIReady() {
        player = new YT.Player("player", {
          height: "100%",
          width: "100%",
          videoId: "",
          playerVars: { autoplay: 1, enablejsapi: 1 },
          events: {
            onReady: () => {
              if (playlist.length > 0 && !isPlaying) {
                playNext();
              }
            },
            onStateChange: (e) => {
              if (e.data === YT.PlayerState.ENDED) playNext();
            },
          },
        });
      }
    </script>
  </body>
</html>
